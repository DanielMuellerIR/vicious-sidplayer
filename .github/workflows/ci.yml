# Linux-CI fuer den portablen Kern und das CLI.
#
# Warum nur Linux: Die macOS-Seite entsteht ohnehin auf einem Mac und faellt dort
# sofort auf. Der Linux-Pfad dagegen wuerde still verrotten — genau dagegen laeuft
# dieser Job. Er baut im selben Container, in dem der Port entwickelt und geprueft
# wurde (swift:6.0), damit CI und Handarbeit dasselbe sehen.
#
# `swift test` enthaelt den Determinismus-Test: Er rendert eine synthetisch
# erzeugte SID und vergleicht den Hash gegen den auf macOS ermittelten Wert. Faellt
# er hier um, hat entweder jemand die Emulation geaendert oder die
# Plattform-Unabhaengigkeit ist kaputt.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Erlaubt einen Lauf von Hand ueber die Actions-Oberflaeche.
  workflow_dispatch:

jobs:
  linux:
    name: Linux (Swift 6.0)
    runs-on: ubuntu-latest
    container: swift:6.0

    steps:
      - uses: actions/checkout@v4

      # ALSA fuer die Audioausgabe, D-Bus fuer MPRIS2. Beides sind Header-Pakete;
      # ohne sie scheitern die systemLibrary-Targets CALSA und CDBus.
      - name: Systembibliotheken installieren
        run: |
          apt-get update -qq
          apt-get install -y -qq libasound2-dev libdbus-1-dev

      # Ohne Sonderflags: Package.swift laesst die Apple-Targets auf Linux per
      # `#if os(macOS)` gar nicht erst ins Paket.
      - name: Bauen
        run: swift build

      - name: Testen
        run: swift test

      # Das Artefakt, das ausgeliefert wird — wenn der Release-Build bricht, soll
      # das hier auffallen und nicht erst beim Paketieren.
      - name: Release-Binary bauen (statisch)
        run: swift build -c release --product vicious-sid --static-swift-stdlib

      # Rauchprobe: Laeuft das gebaute Binary ueberhaupt an? Wiedergabe laesst sich
      # hier nicht pruefen (kein Audiogeraet, kein Session-Bus im Runner) — und es
      # gibt bewusst keine SID-Datei im Repo, gegen die man spielen koennte.
      - name: Binary laeuft an
        run: ./.build/release/vicious-sid --help

      # Die beiden Skript-Testsuiten liefen bisher NIRGENDS in CI: Eine erneute
      # Abweichung zwischen Swift- und HTML5-DSP oder ein Bruch der CLI-Zusagen
      # (Exit-Codes, Kanaltrennung, PCM-Datenmenge) waere trotz gruener CI
      # unbemerkt geblieben (Review-Fund 2026-08-17). Beide brauchen python3,
      # der Paritaetstest zusaetzlich node.
      - name: Werkzeuge fuer die Skript-Tests
        run: apt-get install -y -qq python3 nodejs

      - name: JavaScript-Zustand und Emulationsregressionen
        run: node --test Tests/WebPlayerTests.mjs

      - name: CLI-Abbruch und ungueltige Dump-Dauer
        run: python3 Tests/cli-regressions.py .build/debug/vicious-sid .build/debug/sidcheck

      - name: Release-Gates mit isolierten Testzielen
        run: python3 Tests/release-guards.py

      - name: CLI-Vertrag (Exit-Codes, Kanaltrennung, Datenmenge)
        run: bash Tests/cli-smoke.sh

      - name: Paritaet Swift-DSP gegen HTML5-DSP
        run: bash Tests/parity-html5.sh

      - name: Historienfilter der Veroeffentlichung
        run: bash Tests/publish-history-filter.sh

      # Die beiden Fleet-Regeln vom 2026-08-03 stehen als Quelltest da, liefen
      # aber in keiner CI: Nach /Applications gelangt nur ein Bundle mit
      # angeheftetem Notary-Ticket, und kein absoluter Pfad des Build-Rechners
      # darf im ausgelieferten Bundle landen. Eine Regression in den Release-
      # oder Installationsskripten waere bisher gruen durchgelaufen
      # (Review-Fund 2026-08-20). Der Test liest nur Quellen; die Probe am
      # gebauten Bundle ueberspringt er hier von selbst, weil im Linux-Container
      # keines existiert.
      - name: Fleet-Regeln (Notary-Ticket, keine Build-Pfade)
        run: bash Tests/fleet-rules.sh
